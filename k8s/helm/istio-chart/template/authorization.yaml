{{- if .Values.authorization.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: backend-access
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: backend-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- toYaml .Values.authorization.allowedPrincipals | nindent 14 }}
      to:
        - operation:
            methods: ["GET", "POST", "OPTIONS"]
            paths:
              {{- toYaml .Values.authorization.allowedPaths | nindent 14 }}
{{- end }}