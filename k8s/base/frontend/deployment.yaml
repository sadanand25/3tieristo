apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: frontend
data:
  nginx.conf: |
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Serve static files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        location /api/ {
          #            proxy_pass http://backend-api.backend.svc.cluster.local:8080;
            proxy_pass http://10.107.115.132:8080;
            proxy_http_version 1.1;
            proxy_set_header Host backend-api.backend.svc.cluster.local;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>3-Tier Application</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }
            .container {
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                padding: 40px;
                max-width: 900px;
                width: 100%;
            }
            h1 {
                color: #333;
                margin-bottom: 10px;
                font-size: 2.5em;
            }
            .subtitle {
                color: #666;
                margin-bottom: 30px;
                font-size: 1.1em;
            }
            .tier-badge {
                display: inline-block;
                padding: 5px 15px;
                border-radius: 20px;
                font-size: 0.85em;
                font-weight: 600;
                margin-bottom: 20px;
            }
            .presentation { background: #e3f2fd; color: #1565c0; }
            .application { background: #fff3e0; color: #e65100; }
            .data { background: #e8f5e9; color: #2e7d32; }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-top: 30px;
            }
            .card {
                background: #f8f9fa;
                border-radius: 12px;
                padding: 20px;
                border-left: 4px solid #667eea;
            }
            .card h3 {
                color: #333;
                margin-bottom: 10px;
                font-size: 1.2em;
            }
            .card p {
                color: #666;
                line-height: 1.6;
                margin-bottom: 15px;
            }
            button {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                padding: 10px 25px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 1em;
                font-weight: 600;
                transition: transform 0.2s, box-shadow 0.2s;
                width: 100%;
            }
            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            }
            button:active { transform: translateY(0); }
            .output {
                background: #1e1e1e;
                color: #d4d4d4;
                padding: 20px;
                border-radius: 8px;
                margin-top: 20px;
                font-family: 'Courier New', monospace;
                font-size: 0.9em;
                overflow-x: auto;
                max-height: 300px;
                overflow-y: auto;
                white-space: pre-wrap;
                word-break: break-all;
            }
            .output::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            .output::-webkit-scrollbar-track {
                background: #2d2d2d;
                border-radius: 4px;
            }
            .output::-webkit-scrollbar-thumb {
                background: #555;
                border-radius: 4px;
            }
            .status {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                margin-right: 8px;
            }
            .status.online { background: #4caf50; }
            .status.offline { background: #f44336; }
        </style>
    </head>
    <body>
        <div class="container">
            <span class="tier-badge presentation">📱 Presentation Tier</span>
            <h1>3-Tier Application</h1>
            <p class="subtitle">Kubernetes + Istio Service Mesh Demo</p>

            <div class="grid">
                <div class="card">
                    <h3>🏥 Backend Health</h3>
                    <p>Check if the backend API is healthy</p>
                    <button onclick="checkHealth()">Check Health</button>
                </div>
                <div class="card">
                    <h3>ℹ️ API Info</h3>
                    <p>Get backend service information</p>
                    <button onclick="getInfo()">Get Info</button>
                </div>
                <div class="card">
                    <h3>📊 Get Data</h3>
                    <p>Fetch data from the application tier</p>
                    <button onclick="getData()">Fetch Data</button>
                </div>
                <div class="card">
                    <h3>👥 Get Users</h3>
                    <p>Fetch user list from backend</p>
                    <button onclick="getUsers()">Get Users</button>
                </div>
                <div class="card">
                    <h3>📦 Get Products</h3>
                    <p>Fetch product catalog</p>
                    <button onclick="getProducts()">Get Products</button>
                </div>
                <div class="card">
                    <h3>🧪 Test All</h3>
                    <p>Run all API tests at once</p>
                    <button onclick="testAll()">Run All Tests</button>
                </div>
            </div>

            <div id="output" class="output">Ready. Click a button to test the API.</div>
        </div>

        <script>
            const output = document.getElementById('output');

            function log(message, data = null) {
                const timestamp = new Date().toLocaleTimeString();
                let text = `[${timestamp}] ${message}`;
                if (data) {
                    text += '\n' + JSON.stringify(data, null, 2);
                }
                output.textContent = text + '\n\n' + output.textContent;
                output.scrollTop = 0;
            }

            async function fetchAPI(endpoint, description) {
                log(`Testing ${description}...`);
                try {
                    const response = await fetch(endpoint);
                    const data = await response.json();
                    log(`✅ ${description} - Success (${response.status})`, data);
                    return data;
                } catch (error) {
                    log(`❌ ${description} - Failed`, { error: error.message });
                }
            }

            function checkHealth() {
                fetchAPI('/api/health', 'Health Check');
            }

            function getInfo() {
                fetchAPI('/api/info', 'API Info');
            }

            function getData() {
                fetchAPI('/api/data', 'Data Fetch');
            }

            function getUsers() {
                fetchAPI('/api/users', 'Users Fetch');
            }

            function getProducts() {
                fetchAPI('/api/products', 'Products Fetch');
            }

            async function testAll() {
                log('=== Running All Tests ===');
                await checkHealth();
                await getInfo();
                await getData();
                await getUsers();
                await getProducts();
                log('=== All Tests Complete ===');
            }
        </script>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web
  namespace: frontend
  labels:
    app: frontend-web
    tier: presentation
spec:
  selector:
    app: frontend-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: frontend
  labels:
    app: frontend-web
    tier: presentation
  annotations:
    sidecar.istio.io/proxyCPU: "100m"
    sidecar.istio.io/proxyMemory: "128Mi"
    sidecar.istio.io/proxyCPULimit: "500m"
    sidecar.istio.io/proxyMemoryLimit: "512Mi"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend-web
        tier: presentation
        version: v1
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: frontend-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: frontend-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: frontend-config
          configMap:
            name: frontend-config
