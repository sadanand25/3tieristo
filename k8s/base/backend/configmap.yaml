apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend
data:
  app.js: |
    const http = require('http');
    const url = require('url');

    const PORT = 8080;

    // Simple in-memory cache (Redis would be used in production)
    const cache = {};

    // Helper to make HTTP requests
    function httpGet(host, port, path, timeout = 3000) {
      return new Promise((resolve, reject) => {
        const options = {
          hostname: host,
          port: port,
          path: path,
          method: 'GET',
          timeout: timeout
        };

        const req = http.request(options, (res) => {
          let data = '';
          res.on('data', chunk => data += chunk);
          res.on('end', () => resolve({ status: res.statusCode, data }));
        });

        req.on('error', reject);
        req.on('timeout', () => {
          req.destroy();
          reject(new Error('Request timeout'));
        });

        req.end();
      });
    }

    const server = http.createServer(async (req, res) => {
      res.setHeader('Content-Type', 'application/json');
      res.setHeader('Access-Control-Allow-Origin', '*');

      const parsedUrl = url.parse(req.url, true);
      const path = parsedUrl.pathname;

      console.log(`[${new Date().toISOString()}] ${req.method} ${path}`);

      // Health check
      if (path === '/health') {
        res.writeHead(200);
        res.end(JSON.stringify({
          status: 'healthy',
          service: 'backend-api',
          tier: 'application',
          timestamp: new Date().toISOString(),
          pod: process.env.HOSTNAME || 'unknown'
        }));
        return;
      }

      // API Info
      if (path === '/api/info') {
        res.writeHead(200);
        res.end(JSON.stringify({
          service: 'backend-api',
          version: '1.0.0',
          tier: 'application',
          pod: process.env.HOSTNAME,
          databases: {
            postgres: {
              host: process.env.POSTGRES_HOST,
              port: process.env.POSTGRES_PORT
            },
            mysql: {
              host: process.env.MYSQL_HOST,
              port: process.env.MYSQL_PORT
            },
            redis: {
              host: process.env.REDIS_HOST,
              port: process.env.REDIS_PORT
            }
          }
        }));
        return;
      }

      // Data endpoints - simulate database calls
      if (path === '/api/data') {
        // Check cache first
        const cacheKey = 'api-data';
        if (cache[cacheKey] && Date.now() - cache[cacheKey].timestamp < 5000) {
          res.writeHead(200);
          res.end(JSON.stringify({
            source: 'cache',
            data: cache[cacheKey].data,
            pod: process.env.HOSTNAME
          }));
          return;
        }

        const result = {
          message: 'Data from backend API',
          timestamp: new Date().toISOString(),
          databases: {
            postgres: {
              host: process.env.POSTGRES_HOST,
              port: process.env.POSTGRES_PORT,
              status: 'configured'
            },
            mysql: {
              host: process.env.MYSQL_HOST,
              port: process.env.MYSQL_PORT,
              status: 'configured'
            },
            redis: {
              host: process.env.REDIS_HOST,
              port: process.env.REDIS_PORT,
              status: 'configured'
            }
          },
          pod: process.env.HOSTNAME
        };

        // Cache the result
        cache[cacheKey] = { data: result, timestamp: Date.now() };

        res.writeHead(200);
        res.end(JSON.stringify({ source: 'database', data: result }));
        return;
      }

      // Users endpoint
      if (path === '/api/users') {
        res.writeHead(200);
        res.end(JSON.stringify({
          users: [
            { id: 1, name: 'Alice', role: 'admin' },
            { id: 2, name: 'Bob', role: 'user' },
            { id: 3, name: 'Charlie', role: 'user' }
          ],
          pod: process.env.HOSTNAME,
          timestamp: new Date().toISOString()
        }));
        return;
      }

      // Products endpoint
      if (path === '/api/products') {
        res.writeHead(200);
        res.end(JSON.stringify({
          products: [
            { id: 101, name: 'Laptop', price: 999.99, stock: 50 },
            { id: 102, name: 'Phone', price: 699.99, stock: 100 },
            { id: 103, name: 'Tablet', price: 399.99, stock: 75 }
          ],
          pod: process.env.HOSTNAME,
          timestamp: new Date().toISOString()
        }));
        return;
      }

      // Default
      res.writeHead(200);
      res.end(JSON.stringify({
        service: 'backend-api',
        tier: 'application',
        endpoints: [
          '/health',
          '/api/info',
          '/api/data',
          '/api/users',
          '/api/products'
        ],
        pod: process.env.HOSTNAME
      }));
    });

    server.listen(PORT, '0.0.0.0', () => {
      console.log(`Backend API server listening on port ${PORT}`);
      console.log(`Pod: ${process.env.HOSTNAME}`);
    });